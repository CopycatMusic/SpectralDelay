name: Build Plugin (Standard + Lite)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  JUCE_VERSION: "8.0.12"

jobs:
  # ===========================================================================
  # macOS Build (Universal Binary: Intel + Apple Silicon)
  # ===========================================================================
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Extract version from CMakeLists.txt
      id: version
      run: |
        VERSION=$(grep -oE 'project\(CopyCatSpectralDelay VERSION ([0-9.]+)' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
        
    - name: Cache JUCE
      uses: actions/cache@v4
      id: cache-juce-macos
      with:
        path: ${{ github.workspace }}/JUCE
        key: juce-macos-${{ env.JUCE_VERSION }}
        
    - name: Download JUCE
      if: steps.cache-juce-macos.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git
        
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DJUCE_DIR=${{ github.workspace }}/JUCE \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          
    - name: Build All Targets
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)
      
    - name: Package macOS Standard
      run: |
        mkdir -p artifacts/macOS/Standard
        cp -R "build/CopyCatSpectralDelay_artefacts/${{ env.BUILD_TYPE }}/AU/CopyCat Spectral Delay.component" artifacts/macOS/Standard/
        cp -R "build/CopyCatSpectralDelay_artefacts/${{ env.BUILD_TYPE }}/VST3/CopyCat Spectral Delay.vst3" artifacts/macOS/Standard/
        
    - name: Package macOS Lite
      run: |
        mkdir -p artifacts/macOS/Lite
        cp -R "build/CopyCatSpectralDelayLite_artefacts/${{ env.BUILD_TYPE }}/AU/CopyCat Spectral Delay Lite.component" artifacts/macOS/Lite/
        cp -R "build/CopyCatSpectralDelayLite_artefacts/${{ env.BUILD_TYPE }}/VST3/CopyCat Spectral Delay Lite.vst3" artifacts/macOS/Lite/
        
    - name: Upload macOS Standard
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Standard
        path: artifacts/macOS/Standard/
        retention-days: 30
        
    - name: Upload macOS Lite
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Lite
        path: artifacts/macOS/Lite/
        retention-days: 30

  # ===========================================================================
  # Windows Build (64-bit)
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Extract version from CMakeLists.txt
      id: version
      shell: pwsh
      run: |
        $content = Get-Content CMakeLists.txt -Raw
        if ($content -match 'project\(CopyCatSpectralDelay VERSION ([0-9.]+)') {
          $version = $matches[1]
          echo "PROJECT_VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Detected version: $version"
        }
        
    - name: Cache JUCE
      uses: actions/cache@v4
      id: cache-juce-windows
      with:
        path: C:/JUCE
        key: juce-windows-${{ env.JUCE_VERSION }}
        
    - name: Download JUCE
      if: steps.cache-juce-windows.outputs.cache-hit != 'true'
      run: |
        cd C:/
        git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git
        
    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DJUCE_DIR=C:/JUCE
          
    - name: Build All Targets
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      
    - name: Package Windows Standard
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts/Windows/Standard
        Copy-Item -Recurse "build/CopyCatSpectralDelay_artefacts/${{ env.BUILD_TYPE }}/VST3/CopyCat Spectral Delay.vst3" artifacts/Windows/Standard/
        
    - name: Package Windows Lite
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts/Windows/Lite
        Copy-Item -Recurse "build/CopyCatSpectralDelayLite_artefacts/${{ env.BUILD_TYPE }}/VST3/CopyCat Spectral Delay Lite.vst3" artifacts/Windows/Lite/
        
    - name: Upload Windows Standard
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Standard
        path: artifacts/Windows/Standard/
        retention-days: 30
        
    - name: Upload Windows Lite
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Lite
        path: artifacts/Windows/Lite/
        retention-days: 30

  # ===========================================================================
  # Create Release (on tag push)
  # ===========================================================================
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
      
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Display structure
      run: ls -R artifacts
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        prerelease: false
        generate_release_notes: true
        body: |
          ## Download Instructions
          
          Download artifacts and run local signing scripts to create installers.
          
          **macOS**: Run `./scripts/sign_and_notarize_pkg.sh --variant standard|lite`
          **Windows**: Run Inno Setup with `installer_win_standard.iss` or `installer_win_lite.iss`
