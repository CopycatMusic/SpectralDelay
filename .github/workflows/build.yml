name: Build Plugin

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  JUCE_VERSION: "8.0.12"

jobs:
  # ===========================================================================
  # macOS Build (Universal Binary: Intel + Apple Silicon)
  # ===========================================================================
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Extract version from CMakeLists.txt
      id: version
      run: |
        VERSION=$(grep -oE 'project\(CopyCatSpectralDelay VERSION ([0-9.]+)' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
        
    - name: Cache JUCE
      uses: actions/cache@v4
      id: cache-juce-macos
      with:
        path: ${{ github.workspace }}/JUCE
        key: juce-macos-${{ env.JUCE_VERSION }}
        
    - name: Download JUCE
      if: steps.cache-juce-macos.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git
        
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCOPYCAT_COPY_PLUGIN_AFTER_BUILD=OFF \
          -DJUCE_DIR=${{ github.workspace }}/JUCE \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)
      
    - name: Package macOS
      run: |
        mkdir -p artifacts/macOS
        cp -R "build/CopyCatSpectralDelay_artefacts/${{ env.BUILD_TYPE }}/AU/CopyCat Spectral Delay.component" artifacts/macOS/
        cp -R "build/CopyCatSpectralDelay_artefacts/${{ env.BUILD_TYPE }}/VST3/CopyCat Spectral Delay.vst3" artifacts/macOS/
        for bundle in "artifacts/macOS/CopyCat Spectral Delay.component" "artifacts/macOS/CopyCat Spectral Delay.vst3"; do
          codesign --force --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = "${{ steps.version.outputs.PROJECT_VERSION }}"
          lipo -verify_arch arm64 x86_64 "$bundle/Contents/MacOS/CopyCat Spectral Delay"
        done
        
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macOS
        path: artifacts/macOS/
        retention-days: 30

  # ===========================================================================
  # Windows Build (64-bit VST3)
  # ===========================================================================
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Extract version from CMakeLists.txt
      id: version
      shell: pwsh
      run: |
        $content = Get-Content CMakeLists.txt -Raw
        if ($content -match 'project\(CopyCatSpectralDelay VERSION ([0-9.]+)') {
          $version = $matches[1]
          echo "PROJECT_VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Detected version: $version"
        }
        
    - name: Cache JUCE
      uses: actions/cache@v4
      id: cache-juce-windows
      with:
        path: C:/JUCE
        key: juce-windows-${{ env.JUCE_VERSION }}
        
    - name: Download JUCE
      if: steps.cache-juce-windows.outputs.cache-hit != 'true'
      run: |
        cd C:/
        git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git
        
    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCOPYCAT_COPY_PLUGIN_AFTER_BUILD=OFF `
          -DJUCE_DIR=C:/JUCE
          
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      
    - name: Package Windows VST3
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts/Windows
        Copy-Item -Recurse "build/CopyCatSpectralDelay_artefacts/${{ env.BUILD_TYPE }}/VST3/CopyCat Spectral Delay.vst3" artifacts/Windows/
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Windows
        path: artifacts/Windows/
        retention-days: 30

  # ===========================================================================
  # Create Release (on tag push)
  # ===========================================================================
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
      
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Display structure
      run: ls -R artifacts
      
    - name: Zip macOS plugins
      run: |
        cd artifacts/macOS
        # Actions artifact transfer does not retain executable permissions.
        chmod 755 "CopyCat Spectral Delay.component/Contents/MacOS/CopyCat Spectral Delay"
        chmod 755 "CopyCat Spectral Delay.vst3/Contents/MacOS/CopyCat Spectral Delay"
        zip -r ../CopyCat_Spectral_Delay_macOS.zip .

    - name: Zip Windows plugins
      run: |
        cd artifacts/Windows
        zip -r ../CopyCat_Spectral_Delay_Windows.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/CopyCat_Spectral_Delay_Windows.zip
          artifacts/CopyCat_Spectral_Delay_macOS.zip
        body: |
          ## Download Instructions
          
          ### Windows
          Download the Windows ZIP and copy the VST3 bundle to `C:\Program Files\Common Files\VST3`.
          
          ### macOS
          Download the macOS ZIP for manual installation. These builds are ad-hoc signed and not notarized.
